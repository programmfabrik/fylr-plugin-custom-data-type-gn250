# Build configuration for fylr-build-plugin — the explicit build description.
# Delivered files are listed here; "check" (runs with every build) warns when
# a manifest reference is missing from the build folder.
# All features: https://github.com/programmfabrik/fylr-build-plugin
#
# customDataTypeGN250.zip is the name this plugin has always published. fylr updates a
# url plugin by re-fetching the url it stored at install time, so that name is
# kept as an alias beside the repository-named asset — without it every
# existing installation would stop updating, silently.

server:
  install:
  - l10n/customDataTypeGN250.csv
  # assembled server-side files, sources in the order written
  bundles:
    - out: updater/gn250Updater.js
      sources:
      - src/updater/gn250Updater.js
      - webfrontend/gn250Utilities.coffee
webfrontend:
  # assembled into plugin.webfrontend.url, in this order:
  # .coffee is compiled (CoffeeScript 1.x), .scss compiled,
  # anything else taken verbatim
  bundles:
    - sources:
        - webfrontend/CustomDataTypeGN250.coffee
        - webfrontend/CustomDataTypeGN250Facet.coffee
        - webfrontend/gn250Utilities.coffee
  install:
  - webfrontend/customDataTypeGN250.css

zip_aliases:
- customDataTypeGN250.zip
